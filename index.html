<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PROPRETÉ LASER CI - Gestion</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans text-gray-800">

  <!-- Entête -->
  <header class="bg-blue-900 text-white p-4 shadow-md">
    <div class="max-w-4xl mx-auto flex justify-between items-center">
      <h1 class="text-xl font-bold tracking-wide">PROPRETÉ LASER CI</h1>
      <span class="text-xs bg-blue-700 px-2 py-1 rounded">Gestionnaire</span>
    </div>
  </header>

  <main class="max-w-4xl mx-auto p-4 space-y-6">

    <!-- Bilan Financier -->
    <section class="grid grid-cols-3 gap-3 text-center">
      <div class="bg-white p-3 rounded-xl shadow border-l-4 border-blue-600">
        <p class="text-xs text-gray-500 font-semibold">Contrats Total</p>
        <p id="totalContrats" class="text-base font-bold text-blue-900">0 FCFA</p>
      </div>
      <div class="bg-white p-3 rounded-xl shadow border-l-4 border-red-500">
        <p class="text-xs text-gray-500 font-semibold">Dépenses</p>
        <p id="totalDepenses" class="text-base font-bold text-red-600">0 FCFA</p>
      </div>
      <div class="bg-white p-3 rounded-xl shadow border-l-4 border-green-500">
        <p class="text-xs text-gray-500 font-semibold">Bénéfice Net</p>
        <p id="beneficeNet" class="text-base font-bold text-green-600">0 FCFA</p>
      </div>
    </section>

    <!-- Formulaire 1: Nouveau Chantier -->
    <section class="bg-white p-4 rounded-xl shadow space-y-3">
      <h2 class="text-base font-bold text-gray-700 flex items-center gap-2">
        <span>➕</span> Nouveau Chantier / Contrat
      </h2>
      <form id="formChantier" class="space-y-3">
        <input type="text" id="nomChantier" placeholder="Nom du chantier" required class="w-full p-2 border rounded-lg text-sm focus:outline-blue-600">
        <input type="number" id="montantContrat" placeholder="Montant contrat (FCFA)" required class="w-full p-2 border rounded-lg text-sm focus:outline-blue-600">
        <button type="submit" class="w-full bg-blue-900 text-white font-bold py-2 rounded-lg text-sm hover:bg-blue-800">Créer Chantier</button>
      </form>
    </section>

    <!-- Formulaire 2: Enregistrer du Travail -->
    <section class="bg-white p-4 rounded-xl shadow space-y-3">
      <h2 class="text-base font-bold text-gray-700 flex items-center gap-2">
        <span>📸</span> Enregistrer du Travail du jour
      </h2>
      <form id="formTravail" class="space-y-3">
        <select id="selectChantierTravail" required class="w-full p-2 border rounded-lg text-sm bg-gray-50 focus:outline-blue-600">
          <option value="">Sélectionner un chantier...</option>
        </select>
        <textarea id="descTravail" placeholder="Description des travaux réalisés..." required class="w-full p-2 border rounded-lg text-sm focus:outline-blue-600"></textarea>
        <button type="submit" class="w-full bg-green-700 text-white font-bold py-2 rounded-lg text-sm hover:bg-green-600">Enregistrer le travail</button>
      </form>
    </section>

    <!-- Formulaire 3: Enregistrer une Dépense -->
    <section class="bg-white p-4 rounded-xl shadow space-y-3">
      <h2 class="text-base font-bold text-gray-700 flex items-center gap-2">
        <span>💸</span> Enregistrer une Dépense
      </h2>
      <form id="formDepense" class="space-y-3">
        <select id="selectChantierDepense" required class="w-full p-2 border rounded-lg text-sm bg-gray-50 focus:outline-blue-600">
          <option value="">Sélectionner un chantier...</option>
        </select>
        <input type="text" id="motifDepense" placeholder="Motif (ex: Produit vitre)" required class="w-full p-2 border rounded-lg text-sm focus:outline-blue-600">
        <input type="number" id="montantDepense" placeholder="Montant (FCFA)" required class="w-full p-2 border rounded-lg text-sm focus:outline-blue-600">
        <button type="submit" class="w-full bg-red-600 text-white font-bold py-2 rounded-lg text-sm hover:bg-red-500">Ajouter la dépense</button>
      </form>
    </section>

    <!-- Formulaire 4: Personnels / Agents -->
    <section class="bg-white p-4 rounded-xl shadow space-y-3">
      <h2 class="text-base font-bold text-gray-700 flex items-center gap-2">
        <span>👷</span> Personnels / Agents
      </h2>
      <form id="formAgent" class="space-y-3">
        <input type="text" id="nomAgent" placeholder="Nom & Prénom" required class="w-full p-2 border rounded-lg text-sm focus:outline-blue-600">
        <input type="text" id="roleAgent" placeholder="Rôle (ex: Nettoyeur)" required class="w-full p-2 border rounded-lg text-sm focus:outline-blue-600">
        <button type="submit" class="w-full bg-slate-800 text-white font-bold py-2 rounded-lg text-sm hover:bg-slate-700">Ajouter l'agent</button>
      </form>
      <div class="mt-4">
        <h3 class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Liste du personnel</h3>
        <ul id="listeAgents" class="divide-y text-sm"></ul>
      </div>
    </section>

    <!-- Historique -->
    <section class="bg-white p-4 rounded-xl shadow space-y-3">
      <h2 class="text-base font-bold text-gray-700 flex items-center gap-2">
        <span>📋</span> Historique des Chantiers & Travaux
      </h2>
      <div id="historiqueContenu" class="space-y-3 text-sm"></div>
    </section>

  </main>

  <script>
    // Chargement des données locales
    let chantiers = JSON.parse(localStorage.getItem('chantiers')) || [];
    let agents = JSON.parse(localStorage.getItem('agents')) || [];
    let travaux = JSON.parse(localStorage.getItem('travaux')) || [];
    let depenses = JSON.parse(localStorage.getItem('depenses')) || [];

    function sauvegarderEtRendre() {
      localStorage.setItem('chantiers', JSON.stringify(chantiers));
      localStorage.setItem('agents', JSON.stringify(agents));
      localStorage.setItem('travaux', JSON.stringify(travaux));
      localStorage.setItem('depenses', JSON.stringify(depenses));
      
      calculerBilan();
      remplirSelects();
      afficherAgents();
      afficherHistorique();
    }

    function calculerBilan() {
      const totalC = chantiers.reduce((sum, c) => sum + Number(c.montant), 0);
      const totalD = depenses.reduce((sum, d) => sum + Number(d.montant), 0);
      const benefice = totalC - totalD;

      document.getElementById('totalContrats').innerText = totalC.toLocaleString() + ' FCFA';
      document.getElementById('totalDepenses').innerText = totalD.toLocaleString() + ' FCFA';
      document.getElementById('beneficeNet').innerText = benefice.toLocaleString() + ' FCFA';
    }

    function remplirSelects() {
      const selectTravail = document.getElementById('selectChantierTravail');
      const selectDepense = document.getElementById('selectChantierDepense');

      selectTravail.innerHTML = '<option value="">Sélectionner un chantier...</option>';
      selectDepense.innerHTML = '<option value="">Sélectionner un chantier...</option>';

      chantiers.forEach(c => {
        selectTravail.innerHTML += `<option value="${c.id}">${c.nom}</option>`;
        selectDepense.innerHTML += `<option value="${c.id}">${c.nom}</option>`;
      });
    }

    function afficherAgents() {
      const listEl = document.getElementById('listeAgents');
      if (agents.length === 0) {
        listEl.innerHTML = '<li class="py-2 text-gray-400 italic">Aucun agent enregistré</li>';
        return;
      }
      listEl.innerHTML = agents.map(a => `
        <li class="py-2 flex justify-between items-center">
          <span class="font-medium text-gray-800">${a.nom}</span>
          <span class="text-xs bg-gray-200 text-gray-600 px-2 py-0.5 rounded-full">${a.role}</span>
        </li>
      `).join('');
    }

    function afficherHistorique() {
      const container = document.getElementById('historiqueContenu');
      if (chantiers.length === 0) {
        container.innerHTML = '<p class="text-gray-400 italic">Aucun chantier créé pour le moment.</p>';
        return;
      }

      container.innerHTML = chantiers.map(c => {
        const travauxChantier = travaux.filter(t => t.chantierId == c.id);
        const depensesChantier = depenses.filter(d => d.chantierId == c.id);

        return `
          <div class="border rounded-lg p-3 bg-gray-50 space-y-2">
            <div class="flex justify-between items-center font-bold text-blue-900 border-b pb-1">
              <span>${c.nom}</span>
              <span>${Number(c.montant).toLocaleString()} FCFA</span>
            </div>
            <div>
              <p class="text-xs font-semibold text-gray-500">Travaux :</p>
              ${travauxChantier.length ? travauxChantier.map(t => `<p class="text-xs text-gray-700">• ${t.desc}</p>`).join('') : '<p class="text-xs text-gray-400 italic">Aucun travail enregistré</p>'}
            </div>
            <div>
              <p class="text-xs font-semibold text-gray-500">Dépenses :</p>
              ${depensesChantier.length ? depensesChantier.map(d => `<p class="text-xs text-red-600">• ${d.motif} :${Number(d.montant).toLocaleString()} FCFA</p>`).join('') : '<p class="text-xs text-gray-400 italic">Aucune dépense</p>'}
            </div>
          </div>
        `;
      }).join('');
    }

    // Handlers de formulaires
    document.getElementById('formChantier').addEventListener('submit', (e) => {
      e.preventDefault();
      chantiers.push({ id: Date.now(), nom: document.getElementById('nomChantier').value, montant: document.getElementById('montantContrat').value });
      document.getElementById('nomChantier').value = '';
      document.getElementById('montantContrat').value = '';
      sauvegarderEtRendre();
    });

    document.getElementById('formTravail').addEventListener('submit', (e) => {
      e.preventDefault();
      travaux.push({ id: Date.now(), chantierId: document.getElementById('selectChantierTravail').value, desc: document.getElementById('descTravail').value });
      document.getElementById('descTravail').value = '';
      sauvegarderEtRendre();
    });

    document.getElementById('formDepense').addEventListener('submit', (e) => {
      e.preventDefault();
      depenses.push({ id: Date.now(), chantierId: document.getElementById('selectChantierDepense').value, motif: document.getElementById('motifDepense').value, montant: document.getElementById('montantDepense').value });
      document.getElementById('motifDepense').value = '';
      document.getElementById('montantDepense').value = '';
      sauvegarderEtRendre();
    });

    document.getElementById('formAgent').addEventListener('submit', (e) => {
      e.preventDefault();
      agents.push({ id: Date.now(), nom: document.getElementById('nomAgent').value, role: document.getElementById('roleAgent').value });
      document.getElementById('nomAgent').value = '';
      document.getElementById('roleAgent').value = '';
      sauvegarderEtRendre();
    });

    // Initialisation
    sauvegarderEtRendre();
  </script>
</body>
</html>
